<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Climb Monkey Control Panel</title>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { font-family: Arial, sans-serif; background: #0f172a; color: white; text-align: center; margin: 15px; }
        .hidden { display: none !important; }
        .box-panel { background: #1e293b; padding: 20px; border-radius: 10px; max-width: 1200px; margin: auto; }

        button, input {
            padding: 9px; margin: 5px; border-radius: 6px; background: #334155; color: white;
            border: 1px solid #475569; font-size: 15px; cursor: pointer; font-weight: bold;
            position: relative; overflow: hidden;
            transition: transform .12s ease, box-shadow .12s ease, background .15s ease, filter .15s ease;
        }
        button:hover { filter: brightness(1.18); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,0,0,.35); }
        button:active { transform: translateY(0) scale(.94); filter: brightness(.92); box-shadow: 0 1px 4px rgba(0,0,0,.4); }
        button.pressed { animation: btnPop .28s ease; }
        @keyframes btnPop {
            0% { transform: scale(1); }
            35% { transform: scale(.9); }
            65% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Ripple effect element injected by JS */
        .ripple {
            position: absolute; border-radius: 50%; background: rgba(255,255,255,.55);
            transform: scale(0); animation: rippleAnim .55s ease-out forwards;
            pointer-events: none;
        }
        @keyframes rippleAnim {
            to { transform: scale(2.6); opacity: 0; }
        }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 15px; margin-top: 15px; }
        .card {
            background: linear-gradient(155deg, #1e293b, #17202f);
            border: 2px solid #334155; border-radius: 10px; cursor: pointer; padding: 10px; text-align: left;
            transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
        }
        .card:hover {
            border-color: #00e08f;
            transform: translateY(-4px) scale(1.015);
            box-shadow: 0 10px 26px -8px rgba(0,224,143,.35), 0 0 0 1px rgba(0,224,143,.25) inset;
        }
        .card:active { transform: translateY(-1px) scale(.98); }
        .preview { background: #020617; height: 65px; border-radius: 6px; margin-bottom: 6px; overflow: hidden; }
        .preview svg path { filter: drop-shadow(0 0 5px currentColor); }

        .wall-container { background: #020617; padding: 15px; border-radius: 6px; max-height: 75vh; overflow: auto; text-align: left; }
        .wall { display: grid; gap: 8px; width: max-content; min-width: 100%; }
        .box {
            background: #111827; padding: 4px; min-height: 65px; width: 45px; font-size: 10px; cursor: move;
            border: 1px solid #1e293b; border-radius: 6px; position: relative; text-align: center; box-sizing: border-box;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        .box:hover { border-color: #334155; }
        .rock {
            width: 35px; height: 35px; transform: rotate(-90deg); display: block; margin: 4px auto;
            transition: filter .2s ease;
        }
        .seg {
            fill: #2a3547; stroke: #020617; stroke-width: 2;
            transition: fill .18s ease, filter .18s ease;
        }
        .seg.clickable { cursor: pointer; }
        .seg.clickable:hover { filter: brightness(1.4); }

        /* Bright, glowing lit segments — the "super brightness" look */
        .r.on { fill: #ff2d2d; filter: drop-shadow(0 0 6px #ff2d2d) drop-shadow(0 0 14px rgba(255,45,45,.85)); }
        .g.on { fill: #2dff7a; filter: drop-shadow(0 0 6px #2dff7a) drop-shadow(0 0 14px rgba(45,255,122,.85)); }
        .b.on { fill: #2d8bff; filter: drop-shadow(0 0 6px #2d8bff) drop-shadow(0 0 14px rgba(45,139,255,.85)); }
        .seg.on { animation: segPulse 1.6s ease-in-out infinite; }
        @keyframes segPulse {
            0%, 100% { filter: brightness(1) drop-shadow(0 0 6px currentColor); }
            50% { filter: brightness(1.35) drop-shadow(0 0 16px currentColor); }
        }

        .empty { margin-top: 20px; color: #475569; font-weight: bold; font-size: 14px; }
        .action-btns { position: absolute; top: 1px; left: 0; right: 0; display: flex; justify-content: center; gap: 2px; z-index: 10; }
        .action-btns span {
            font-size: 8px; padding: 1px 2px; background: #1e293b; border-radius: 2px; cursor: pointer;
            color: #38bdf8; font-weight: bold; transition: background .15s ease, transform .12s ease;
        }
        .action-btns span:hover { background: #0284c7; color: white; }
        .action-btns span:active { transform: scale(.85); }
        .status-msg { display: inline-block; margin-left: 10px; font-size: 13px; color: #4ade80; min-width: 160px; text-align: left; }

        /* Smooth appearance for screens */
        #p2:not(.hidden), #p3:not(.hidden) { animation: fadeSlide .25s ease; }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div style="position:fixed; top:5px; right:8px; font-size:11px; color:#4ade80; background:#020617; padding:3px 8px; border-radius:4px; z-index:999;">v6b — with Copy as Code</div>

    <!-- ===================== LOGIN ===================== -->
    <div id="p1" class="box-panel" style="max-width: 310px; margin-top: 15vh;">
        <h2>CLIMB <span style="color:#00a86b;">MONKEY</span></h2>
        <input type="text" id="user" placeholder="User ID" style="width: 85%;"><br>
        <input type="password" id="pass" placeholder="Password" style="width: 85%;"><br>
        <button style="background:#00a86b; font-weight:bold; border:none; width:92%;" onclick="login()">Sign In</button>
        <p id="err" style="color: #ef4444; font-size: 13px; font-weight: bold; margin-top:10px;"></p>
    </div>

    <!-- ===================== CATALOG ===================== -->
    <div id="p2" class="box-panel hidden">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 id="tag" style="margin: 0; color:#00a86b;">CLIMB MONKEY</h2>
            <button onclick="logout()" style="background:#ef4444; border:none;">Logout</button>
        </div>
        <div id="levelAdminBar" class="hidden" style="margin-top:10px;">
            <button style="background:#16a34a;" onclick="addLevelPrompt()">➕ Add Level</button>
            <span style="color:#94a3b8; font-size:12px; margin-left:6px;">Click a level's ✕ to remove it</span>
        </div>
        <div class="grid" id="lvls"></div>
    </div>

    <!-- ===================== LEVEL ===================== -->
    <div id="p3" class="box-panel hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap: wrap;">
            <button onclick="show('p2','p3')" style="background:#475569;">⬅ Catalog</button>
            <h3 id="title" style="color:#00a86b; margin:0;">Level</h3>
        </div>

        <h2>CLIMB MONKEY</h2>

        <div style="margin-bottom: 10px;">
            <button onclick="startBlink()" style="background:#10b981; border:none; font-weight:bold;">▶ START</button>
            <button onclick="stopBlink()" style="background:#ef4444; border:none; font-weight:bold;">⏹ STOP</button>
            <button style="background:#f97316;" onclick="allOff()">↺ Reset</button>
        </div>

        <div id="adminTools" class="hidden" style="margin-bottom: 10px;">

            <button style="background:#f97316;" onclick="resetToDefault()">↺ Reset Layout</button>

        </div>

        <div class="wall-container">
            <div class="wall" id="matrix"></div>
        </div>
    </div>

    <!-- ===================== GENERIC CONFIRM MODAL ===================== -->
    <div id="genericConfirmModal" class="hidden" style="position:fixed; inset:0; background:rgba(8,10,12,.8); z-index:1000; display:flex; align-items:center; justify-content:center; padding:20px;">
        <div style="background:#1e293b; border:1px solid #334155; border-radius:10px; max-width:380px; width:100%; padding:20px;">

            <div style="display:flex; gap:8px;">
                <button style="background:#f97316; flex:1;" onclick="runGenericConfirm()">Yes, continue</button>

            </div>
        </div>
    </div>

    <!-- ===================== ADD LEVEL MODAL ===================== -->

                <button style="background:#16a34a; flex:1;" onclick="confirmAddLevel()">Add</button>
                <button style="background:#475569; flex:1;" onclick="closeAddLevelModal()">Cancel</button>
            </div>
        </div>
    </div>

                <button style="background:#475569; flex:1;" onclick="closeRemoveLevelModal()">Cancel</button>
            </div>
        </div>
    </div>

        const LINE_COLORS = ["#ef4444", "#22c55e", "#3b82f6", "#ef4444", "#22c55e", "#3b82f6", "#ef4444", "#22c55e", "#3b82f6", "#ef4444"];

        const LEVELS_KEY = "climbMonkeyLevels";
        const DEFAULT_LEVELS = [
            "Vertical Line", "Left Diagonal", "Right Leaning", "Zig-Zag Cross", "Pyramid Peak",
            "Diamond Core", "Snake Curve", "Outer Frame", "Scattered Hold", "Overhang End"
        ];

        // levels = array of {id, name}. id is stable and used for lighting/title, independent of position.
        let levels = [];
        let nextLevelId = 1;
        let curLevelId = null;

        function loadLevels() {
            const saved = localStorage.getItem(LEVELS_KEY);
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    levels = data.levels || [];
                    nextLevelId = data.nextLevelId || (levels.length + 1);
                    return;
                } catch (e) { console.error("Failed to load levels", e); }
            }
            // first run: seed with the original 10 levels
            levels = DEFAULT_LEVELS.map((name, i) => ({ id: i + 1, name }));
            nextLevelId = levels.length + 1;
        }

        function saveLevels() {
            localStorage.setItem(LEVELS_KEY, JSON.stringify({ levels, nextLevelId }));
        }

        function renderCatalog() {
            document.getElementById("levelAdminBar").className = (curUser === "inceptarc") ? "" : "hidden";
            let box = document.getElementById("lvls"); box.innerHTML = "";
            levels.forEach((lvl, idx) => {
                const shape = LINE_SHAPES[idx % LINE_SHAPES.length];
                const color = LINE_COLORS[idx % LINE_COLORS.length];
                const removeBtn = (curUser === "inceptarc")
                    ? `<span onclick="event.stopPropagation(); removeLevel(${lvl.id})" style="position:absolute; top:6px; right:8px; color:#ef4444; font-weight:bold; cursor:pointer;">✕</span>`
                    : "";
                box.innerHTML += `
                    <div class="card" style="position:relative;" onclick="openLvl(${lvl.id})">
                        ${removeBtn}
                        <div class="preview"><svg style="width:100%; height:100%;"><path d="${shape}" stroke="${color}" stroke-width="2" fill="none"/></svg></div>
                        <b>Level ${idx + 1}</b><br>
                        <span style="color:#00a86b; font-size:12px;">${lvl.name}</span>
                    </div>`;
            });
        }

        function addLevelPrompt() {
            if (curUser !== "inceptarc") return;
            document.getElementById("newLevelName").value = "";
            document.getElementById("addLevelModal").classList.remove("hidden");
            setTimeout(() => document.getElementById("newLevelName").focus(), 50);
        }

        function closeAddLevelModal() {
            document.getElementById("addLevelModal").classList.add("hidden");
        }

        function confirmAddLevel() {
            const raw = document.getElementById("newLevelName").value.trim();
            const name = raw || `Level ${levels.length + 1}`;
            levels.push({ id: nextLevelId, name });
            nextLevelId++;
            saveLevels();
            renderCatalog();
            closeAddLevelModal();
        }

        let pendingRemoveId = null;

        function removeLevel(id) {
            if (curUser !== "inceptarc") return;
            const lvl = levels.find(l => l.id === id);
            if (!lvl) return;
            pendingRemoveId = id;
            document.getElementById("removeLevelText").textContent =
                `Remove "${lvl.name}"? This only removes it from the catalog; its saved light pattern is not deleted.`;
            document.getElementById("removeLevelModal").classList.remove("hidden");
        }

        function closeRemoveLevelModal() {
            pendingRemoveId = null;
            document.getElementById("removeLevelModal").classList.add("hidden");
        }

        function confirmRemoveLevel() {
            if (pendingRemoveId === null) return;
            levels = levels.filter(l => l.id !== pendingRemoveId);
            saveLevels();
            renderCatalog();
            closeRemoveLevelModal();
        }

        function login() {
            let u = document.getElementById("user").value.trim(), p = document.getElementById("pass").value;
            let passMap = {"inceptarc":"incept@7", "user1":"incept@73", "user2":"incept@73", "user3":"incept@73"};
            if (passMap[u] && passMap[u] === p) {
                curUser = u; document.getElementById("tag").innerText = `CLIMB MONKEY (${u})`; show('p2', 'p1');
                loadLevels();
                renderCatalog();
            } else { document.getElementById("err").innerText = "⚠️ Invalid User ID or Password!"; }
        }

        ];

        let arr = [...DEFAULT_ARR];

        function loadFromStorage(silent) {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    arr = data.arr;
                    lights = data.lights || {};
                    currentCols = data.cols || 35;
                    if (!silent) showStatus("Layout loaded ✔");
                    return true;
                } catch (e) { console.error("Failed to load saved layout", e); }
            }
            return false;
        }

        function showStatus(msg) {
            const el = document.getElementById("statusMsg");
            el.textContent = msg;
            setTimeout(() => { el.textContent = ""; }, 2500);
        }

        function saveState() {
            undoStack.push({ gridArr: [...arr], lightStates: JSON.stringify(lights), cols: currentCols });
            redoStack = [];
            updateButtons();
        }

        function updateButtons() {
            document.getElementById("undoBtn").style.opacity = undoStack.length === 0 ? "0.5" : "1";
            document.getElementById("redoBtn").style.opacity = redoStack.length === 0 ? "0.5" : "1";
        }

        function saveToStorage() {
            const data = { arr: arr, lights: lights, cols: currentCols };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            showStatus("Saved to browser ✔");
        }

        function resetToDefault() {
            showGenericConfirm(
                "Reset to the original default layout? This clears your custom arrangement.",
                () => {
                    saveState();
                    arr = [...DEFAULT_ARR];
                    lights = {};
                    currentCols = 35;
                    draw();
                    showStatus("Reset to original ✔");
                }
            );
        }

        // -------- Generic in-page confirm (replaces native confirm() which some sandboxed views block) --------
        let genericConfirmAction = null;

        function showGenericConfirm(message, onConfirm) {
            genericConfirmAction = onConfirm;
            document.getElementById("genericConfirmText").textContent = message;
            document.getElementById("genericConfirmModal").classList.remove("hidden");
        }

        function closeGenericConfirm() {
            genericConfirmAction = null;
            document.getElementById("genericConfirmModal").classList.add("hidden");
        }

        function runGenericConfirm() {
            const action = genericConfirmAction;
            closeGenericConfirm();
            if (action) action();
        }

        function draw() {
            const wall = document.getElementById("matrix");
            wall.style.gridTemplateColumns = `repeat(${currentCols}, minmax(45px, 1fr))`;

            const canEdit = (curUser === "inceptarc");
            const parts = new Array(arr.length);

            arr.forEach((id, idx) => {
                let inner = canEdit
                    ? `<div class="action-btns"><span onclick="insertRowInBetween(${idx})">+R</span><span onclick="insertColInBetween(${idx})">+C</span></div>`
                    : "";

                if (id !== null && id !== "") {
                    const st = lights[id] || { r: false, g: false, b: false };
                    const clickR = canEdit ? `onclick="clickSeg(${id}, 'r')"` : "";
                    const clickG = canEdit ? `onclick="clickSeg(${id}, 'g')"` : "";
                    const clickB = canEdit ? `onclick="clickSeg(${id}, 'b')"` : "";
                    const clickableClass = canEdit ? "clickable" : "";
                    inner += `
                        <div style="margin-top:12px;">#${id}</div>
                        <svg class="rock" viewBox="0 0 100 100" data-hold="${id}">
                            <path class="seg r ${clickableClass} ${st.r ? 'on' : ''}" data-seg="r" ${clickR} d="M50,50 L50,5 A45,45 0 0,0 11,72 Z"/>
                            <path class="seg b ${clickableClass} ${st.b ? 'on' : ''}" data-seg="b" ${clickB} d="M50,50 L11,72 A45,45 0 0,0 89,72 Z"/>
                            <path class="seg g ${clickableClass} ${st.g ? 'on' : ''}" data-seg="g" ${clickG} d="M50,50 L89,72 A45,45 0 0,0 50,5 Z"/>
                        </svg>`;
                } else {
                    inner += `<div class="empty">-</div>`;
                }

                const dragAttrs = canEdit
                    ? `draggable="true" ondragstart="ds(${idx})" ondragover="dov(event)" ondrop="dp(${idx})"`
                    : "";
                parts[idx] = `<div class="box" ${dragAttrs}>${inner}</div>`;
            });

            wall.innerHTML = parts.join("");
            updateButtons();
        }

        function clickSeg(id, seg) {
            if (curUser !== "inceptarc") return;
            saveState();
            if (!lights[id]) lights[id] = { r: false, g: false, b: false };
            lights[id][seg] = !lights[id][seg];
            const svg = document.querySelector(`svg[data-hold="${id}"]`);
            if (svg) {
                const path = svg.querySelector(`path[data-seg="${seg}"]`);
                if (path) path.classList.toggle('on', !!lights[id][seg]);
            } else {
                draw();
            }
        }

        function allOff() {
            stopBlink();
            lights = {};
            draw();
        }

        function insertRowInBetween(idx) {
            saveState();
            let rowEndIndex = idx - (idx % currentCols) + currentCols;
            for(let i = 0; i < currentCols; i++) { arr.splice(rowEndIndex, 0, null); }
            draw();
        }

        function insertColInBetween(idx) {
            saveState();
            let targetCol = idx % currentCols;
            let totalRows = arr.length / currentCols;
            for (let r = totalRows - 1; r >= 0; r--) {
                let insertPos = (r * currentCols) + targetCol + 1;
                arr.splice(insertPos, 0, null);
            }
            currentCols++;
            draw();
        }

        function ds(i) { dragIdx = i; }
        function dov(e) { e.preventDefault(); }
        function dp(i) {
            if (dragIdx === null || dragIdx === i) return;
            saveState();
            let tmp = arr[dragIdx]; arr[dragIdx] = arr[i]; arr[i] = tmp;
            draw();
        }

        function undo() {
            if (undoStack.length === 0) return;
            redoStack.push({ gridArr: [...arr], lightStates: JSON.stringify(lights), cols: currentCols });
            let prev = undoStack.pop();
            arr = prev.gridArr; lights = JSON.parse(prev.lightStates); currentCols = prev.cols;
            draw();
        }

        function redo() {
            if (redoStack.length === 0) return;
            undoStack.push({ gridArr: [...arr], lightStates: JSON.stringify(lights), cols: currentCols });
            let next = redoStack.pop();
            arr = next.gridArr; lights = JSON.parse(next.lightStates); currentCols = next.cols;
            draw();
        }

        let blinkTimer = null;
        let blinkOn = true;

        function startBlink() {
            if (blinkTimer) return;
            blinkTimer = setInterval(() => {
                blinkOn = !blinkOn;
                document.querySelectorAll('.seg.on').forEach(el => { el.style.opacity = blinkOn ? '1' : '0.12'; });
            }, 450);
        }

        function stopBlink() {
            if (blinkTimer) { clearInterval(blinkTimer); blinkTimer = null; }
            blinkOn = true;
            document.querySelectorAll('.seg').forEach(el => { el.style.opacity = '1'; });
        }

        // -------- Export current arrangement as ready-to-paste code --------
        function showCodeExport() {
            if (curUser !== "inceptarc") return;
            const cols = currentCols;
            let lines = [];
            for (let i = 0; i < arr.length; i += cols) {
                const rowVals = arr.slice(i, i + cols).map(v => v === null ? "null" : v);
                lines.push("            " + rowVals.join(","));
            }
            const arrText = lines.join(",\n");

            const code =
`const DEFAULT_ARR = [
${arrText}
];

// currentCols should be set to: ${cols}
let currentCols = ${cols};`;

            document.getElementById("codeOutput").value = code;
            document.getElementById("codeModal").classList.remove("hidden");
        }

        function closeCodeExport() {
            document.getElementById("codeModal").classList.add("hidden");
        }

        function copyCodeExport() {
            const ta = document.getElementById("codeOutput");
            ta.select();
            ta.setSelectionRange(0, 999999);
            try { document.execCommand("copy"); } catch (e) {}
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(ta.value).catch(() => {});
            }
            const st = document.getElementById("copyStatus");
            st.textContent = "Copied ✔";
            setTimeout(() => { st.textContent = ""; }, 2000);
        }

        // ============================================================
        // TACTILE FEEDBACK — ripple + subtle vibration on every tap
        // ============================================================
        function fireRipple(el, evt) {
            const rect = el.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height) * 1.4;
            const ripple = document.createElement("span");
            ripple.className = "ripple";
            ripple.style.width = ripple.style.height = size + "px";
            const x = (evt.clientX ?? rect.left + rect.width / 2) - rect.left - size / 2;
            const y = (evt.clientY ?? rect.top + rect.height / 2) - rect.top - size / 2;
            ripple.style.left = x + "px";
            ripple.style.top = y + "px";
            const posStyle = getComputedStyle(el).position;
            if (posStyle === "static") el.style.position = "relative";
            el.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        }

        function fireVibrate() {
            if (navigator.vibrate) {
                try { navigator.vibrate(12); } catch (e) {}
            }
        }

        document.addEventListener("click", (evt) => {
            const target = evt.target.closest("button, .card, .action-btns span, .seg.clickable");
            if (!target) return;
            fireVibrate();
            fireRipple(target, evt);
            if (target.tagName === "BUTTON") {
                target.classList.remove("pressed");
                void target.offsetWidth; // restart animation
                target.classList.add("pressed");
            }
        }, true);

        loadFromStorage(true);
    </script>
